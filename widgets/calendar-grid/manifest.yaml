name: calendar-grid
version: "1.0.0"
description: Interactive wall calendar with per-member colour coding and week and month views.
provider: calendar-feed

capabilities:
  - ambient-static
  - touch-interactive

default_dimensions: [6, 2]

supported_dimensions:
  - [4, 2]
  - [6, 2]
  - [2, 3]
  - [2, 4]
  - [2, 6]
  - [3, 3]
  - [3, 4]
  - [3, 6]

config_schema:
  type: object
  required:
    - members
    - calendars
  properties:
    title:
      type: string
    default_view:
      type: string
      enum:
        - week
        - month
    days:
      type:
        - string
        - integer
    week_starts:
      type: string
      enum:
        - sunday
        - monday
    time_format:
      type: string
      enum:
        - "24h"
        - "12h"
    hours:
      type: array
      items:
        type: string
    shared_color:
      type: string
    celebrate_special_days:
      type: boolean
      description: Highlight family birthdays and holidays on day columns
    birthdays:
      type:
        - array
        - object
        - boolean
      description: Custom birthday names and dates (MM-DD or YYYY-MM-DD)
    special_days:
      type:
        - array
        - object
      description: Custom special-day names and dates (MM-DD or YYYY-MM-DD)
    event_flair:
      type: boolean
      description: Render keyword-based SVG watermarks on event cards and illustrated banners in the event modal
    members:
      type: array
      items:
        type: object
        required:
          - name
          - color
          - calendars
        properties:
          name:
            type: string
          color:
            type: string
          initial:
            type: string
          pattern:
            type: string
            enum:
              - solid
              - hatch
              - dots
              - outline
          calendars:
            type: array
            items:
              type: string
        additionalProperties: false
    calendars:
      type: array
      items:
        type: object
        required:
          - name
        properties:
          name:
            type: string
          url:
            type: string
          url_env:
            type: string
          color:
            type: string
          private:
            type: boolean
        additionalProperties: false
  additionalProperties: false
